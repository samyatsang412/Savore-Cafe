<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | Savore Café</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/toast.css"></head><body><header class="site-header"><div class="container navbar"><a class="brand" href="index.html"><span class="brand-mark">S</span>SAVORE CAFÉ</a><a class="btn btn-light" style="background:var(--forest);color:white" href="login.html">Login</a></div></header><main class="auth-shell"><div class="auth-card form-card"><div class="eyebrow">Join the table</div><h1>Create account</h1><p>Save your details for a smoother next order.</p><div class="alert" data-auth-message></div><form data-register-form><div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" required></div><button class="btn btn-green" type="submit">Create account</button></form></div></main><script src="assets/js/app.js"></script><script src="assets/js/auth.js"></script></body></html>
